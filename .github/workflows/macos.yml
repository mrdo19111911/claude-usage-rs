# macOS: test, one universal binary (arm64 + x86_64), SCAS.app in a .dmg, smoke tests,
# all three files as workflow artifacts.
# Why this way: docs/SO_SANH_MACOS_BUILD.md, docs/specs/macos-build-prior-art.md;
# what the build does: docs/specs/macos.md.
name: macos

on:
  push:
    branches: [macos-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest # arm64; the x86_64 half is cross-built and run under Rosetta
    env:
      # One minimum for rustc and cc (bundled sqlite, ring); arm64 starts at 11.0.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test (native arm64)
        run: cargo test --locked

      - name: Build both architectures
        run: cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Join into one universal binary
        run: |
          lipo -create -output scas \
            target/aarch64-apple-darwin/release/scas \
            target/x86_64-apple-darwin/release/scas
          codesign --force --sign - scas
          lipo -archs scas
          lipo -archs scas | grep -q x86_64
          lipo -archs scas | grep -q arm64

      # Each half starts and answers /api/state as a macOS build: no installing updates,
      # no Claude Desktop switching.
      - name: Smoke test both halves
        run: |
          smoke() {
            PORT=$2 $1 ./scas --demo --no-open > "smoke-$2.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$2/api/state" -o "state-$2.json" && break
              sleep 1
            done
            kill $pid || true
            cat "smoke-$2.log"
            python3 - "state-$2.json" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          assert s["canInstallUpdates"] is False, s["canInstallUpdates"]
          assert s["desktop"]["supported"] is False, s["desktop"]
          print("ok", s["version"], len(s["accounts"]), "demo accounts")
          PY
          }
          smoke "arch -arm64" 4801
          smoke "arch -x86_64" 4802

      - name: Pack (tar keeps the exec bit)
        id: pack
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="scas-$version-macos-universal.tar.gz"
          tar czf "$name" scas
          shasum -a 256 "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bundle tests (Python)
        run: |
          python3 -P tools/test_build_macos_app.py
          python3 -P tools/test_icns.py
          python3 -P tools/test_macho.py

      - name: Build SCAS.app, sign it ad hoc
        run: |
          python3 tools/build_macos_app.py --binary scas --out dist
          codesign --force --deep --sign - dist/SCAS.app
          codesign --verify --deep --strict --verbose=2 dist/SCAS.app

      - name: Make the dmg
        id: dmg
        run: |
          name="SCAS-${{ steps.pack.outputs.version }}.dmg"
          sh tools/make_dmg.sh dist/SCAS.app "$name"
          shasum -a 256 "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test the dmg's app
        run: bash tools/smoke_macos_app.sh "${{ steps.dmg.outputs.file }}"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dmg.outputs.file }}
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: dist/SCAS-${{ steps.pack.outputs.version }}-macos-app.tar.gz
          archive: false
          if-no-files-found: error
