[package]
name = "scas"
version = "1.6.1"
edition = "2021"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: Claude's own JSON files are rewritten with their keys in the order they had.
serde_json = { version = "1", features = ["preserve_order"] }
# Browser sign-in (OAuth PKCE): random state and verifier, SHA-256 challenge.
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.42.0", features = ["bundled"] }

# The exe's icon and version info (build.rs, docs/specs/exe-resources.md).
[build-dependencies]
embed-resource = "3"

# Closing and finding Claude Desktop for a desktop switch.
[target.'cfg(windows)'.dependencies]
# The dashboard in its own window (docs/specs/dashboard-window.md).
wry = "0.57.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    # The tray icon and its widget (tray.rs); no console window (main).
    "Win32_Graphics_Gdi",
    # Smooth chart lines in the gadget (tray/gdip.rs).
    "Win32_Graphics_GdiPlus",
    # The dashboard window's dark title bar (tray/dash.rs).
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    # The cgemini folder on the user's PATH (gemini/path_win.rs).
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    # Copy to add: reading a copied key from the clipboard (gemini/clipboard.rs).
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Reading Claude Desktop's safeStorage token for usage figures (desktop/safe_storage.rs,
    # aes_gcm.rs): DPAPI unwrap of the app key, AES-256-GCM via BCrypt.
] }

# Windows/Linux: also trust the OS certificate store (company proxies). macOS uses the bundled roots.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = { version = "2.12", features = ["json", "native-certs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
