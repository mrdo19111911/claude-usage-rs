[package]
name = "claude-usage"
version = "1.0.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows/Linux: also trust the OS certificate store (company proxies). macOS uses the bundled roots.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = { version = "2.12", features = ["json", "native-certs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
